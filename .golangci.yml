version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive

  settings:
    staticcheck:
      checks: ["all", "-SA1019"]
    revive:
      rules:
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
